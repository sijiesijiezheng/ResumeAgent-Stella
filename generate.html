<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Agent｜生成智能简历</title>
  <link rel="stylesheet" href="./styles/globals.css" />
</head>
<body>
  <div class="container">
    <h1>生成你的智能简历</h1>
    <p>填写简单信息，即可一键生成简历。</p>

    <h2 class="form-section-heading">填写信息</h2>

    <form id="resumeForm" novalidate>
      <label>姓名：</label>
      <input type="text" id="name" placeholder="例如：张三（与常用称呼一致即可）" required />

      <label>学校：</label>
      <input type="text" id="school" placeholder="例如：某某大学（写学校全称）" required />

      <label>专业：</label>
      <input type="text" id="major" placeholder="例如：计算机科学与技术 / 市场营销" required />

      <label>申请岗位：</label>
      <input type="text" id="job" placeholder="例如：产品实习生、新媒体运营（写目标岗位）" required />

      <label>技能关键词：</label>
      <input type="text" id="skills" placeholder="例如：Excel / 公众号排版 / 活动策划（与岗位相关的关键词）" />

      <label>相关经历：</label>
      <textarea id="experience" placeholder="写一件你做过的事（例如：整理活动资料、协助统计数据、对接参会人员）"></textarea>

      <label>补充说明：</label>
      <textarea id="extra" placeholder="可选：奖学金、比赛、社团职务、证书等，没有可留空"></textarea>
      
      <button type="submit" id="generateBtn">生成简历</button>
    </form>

    <div id="loading" style="display:none;">正在生成中…</div>
    <div id="result" class="result"></div>

    <div class="btn-group">
      <button type="button" id="wordBtn" disabled>导出 Word</button>
      <button type="button" id="copyBtn" disabled>复制内容</button>
      <button type="button" id="pdfBtn" disabled>导出文本</button>
    </div>

    <p class="back-link"><a href="index.html">返回首页</a></p>
  </div>
  <script src="./config.js"></script>
  <script src="./script.js"></script>
<!-- === Resume Agent 试用反馈区块 v1.0 === -->
<section id="feedback" style="margin-top:60px; text-align:center;">
  <h2 style="font-size:20px; color:#2563eb; margin-bottom:10px;">💬 帮我们改进 Resume Agent</h2>
  <p style="color:#555; margin-bottom:20px;">
    体验完简历生成后，请花 2 分钟填写反馈表单，帮助我们优化下一版本 🙏
  </p>
  <iframe 
    src="https://gsux94wlsf.feishu.cn/share/base/form/shrcn5PYDxProgPbVNCLxxXKHuh"
    width="100%"
    height="600"
    frameborder="0"
    style="border-radius:12px; max-width:720px; margin:auto; display:block;">
  </iframe>
</section>
</body>
</html>
