<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第一步｜开始你的简历</title>
  <link rel="stylesheet" href="./styles/globals.css" />
  <style>
    .chat-container {
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
    }
    .chat-box {
      min-height: 400px;
      border-radius: 12px;
      padding: 20px;
      background: #f9fafb;
      overflow-y: auto;
    }
    .msg {
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .ai {
      color: #111;
    }
    .user {
      text-align: right;
      color: #2563eb;
    }
    .input-box {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .input-box input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .input-box button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
<div class="chat-container">
  <h1 style="text-align:center;">第一步</h1>
  <p style="text-align:center;">不用想太多，我们一步一步来。</p>

  <div id="chatBox" class="chat-box"></div>

  <div class="input-box">
    <input id="userInput" placeholder="输入你的回答..." />
    <button id="sendBtn">发送</button>
  </div>

  <div id="loading" style="display:none;text-align:center;margin-top:10px;">
    正在生成简历...
  </div>

  <div id="result" class="result"></div>
</div>

<script src="./config.js"></script>
<script>
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("userInput");
const btn = document.getElementById("sendBtn");
const loading = document.getElementById("loading");
const result = document.getElementById("result");

let step = 0;

const answers = {
  job: "",
  achievement: "",
  behavior: "",
  skills: "",
  upgrade: "",
  proof: "",
  name: "",
  school: "",
  major: ""
};

const questions = [
  "你现在最想投什么岗位？（可以随便说一个）",
  "说一件你做过、还挺有成就感的事（重点说你做了什么）",
  "你具体做了哪些事情？一步一步说就行",
  "你平时会用到哪些技能或工具？",
  "如果给你两天，你最想补一个什么技能？",
  "如果要用一件小任务证明你能工作，你会选什么？",
  "你叫什么名字？",
  "你学校是哪里？",
  "你的专业是什么？"
];

function addMessage(text, type="ai") {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function saveAnswer(val) {
  if (step === 0) answers.job = val;
  if (step === 1) answers.achievement = val;
  if (step === 2) answers.behavior = val;
  if (step === 3) answers.skills = val;
  if (step === 4) answers.upgrade = val;
  if (step === 5) answers.proof = val;
  if (step === 6) answers.name = val;
  if (step === 7) answers.school = val;
  if (step === 8) answers.major = val;
}

async function generateResume() {
  loading.style.display = "block";

  const payload = {
    name: answers.name,
    school: answers.school,
    major: answers.major,
    job: answers.job,
    skills: answers.skills + "；" + answers.upgrade,
    experience: answers.achievement + "\n" + answers.behavior,
    extra: answers.proof
  };

  try {
    const resp = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

    const data = await resp.json();
    loading.style.display = "none";

    result.innerHTML = "<h2>生成结果</h2><div class='resume-block'>" + data.resume + "</div>";
  } catch (e) {
    loading.style.display = "none";
    result.innerHTML = "<p>生成失败，请重试</p>";
  }
}

btn.onclick = () => {
  const val = input.value.trim();
  if (!val) return;

  addMessage(val, "user");
  saveAnswer(val);
  input.value = "";

  step++;

  if (step < questions.length) {
    setTimeout(() => addMessage(questions[step]), 400);
  } else {
    addMessage("好的，我来帮你整理一下简历...");
    generateResume();
  }
};

// 初始问题
addMessage(questions[0]);
</script>
</body>
</html>
