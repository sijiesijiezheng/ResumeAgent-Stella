+// 句子生成逻辑：根据两个选项拼出低门槛“可转译表达”，并提供同义候选。
+function buildSentenceVariants(s1, s2) {
+  const uncertainS1 = s1.includes("说不太清");
+  const uncertainS2 = s2.includes("不太确定");
+
+  if (uncertainS1 && uncertainS2) {
+    return [
+      "我做过一些基础协助工作",
+      "我参与过一些整理和协助类的事情",
+      "我在学校里做过一些执行和配合类任务"
+    ];
+  }
+
+  const sceneMap = {
+    "我做过课程作业 / 上课相关的事情": ["我在课程作业中", "我在上课相关任务里"],
+    "我帮老师或同学做过一些事": ["我帮老师", "我帮同学"],
+    "我参加过活动 / 社团 / 班级事务": ["我在活动中", "我在社团/班级事务里"],
+    "我做过兼职 / 打工 / 简单实习": ["我在兼职中", "我在打工/实习中"],
+    "我也说不太清，但可以先开始": ["我做过", "我参与过"]
+  };
+
+  const actionMap = {
+    "整理东西（资料 / 表格 / 文件）": ["整理过资料", "整理过表格和文件"],
+    "通知别人 / 对接事情": ["通知过同学", "对接过一些事情"],
+    "记录信息 / 登记内容": ["做过信息登记", "记录过基础信息"],
+    "协助别人完成事情": ["协助处理过事务", "配合完成过任务"],
+    "写过一点内容 / 文案": ["写过基础文案", "整理过简单内容"],
+    "不太确定，选一个接近的": ["做过一些协助和执行类工作", "参与过基础配合工作"]
+  };
+
+  const scenes = sceneMap[s1] || ["我做过"];
+  const actions = actionMap[s2] || ["一些基础工作"];
+  const variants = [];
+
+  for (const scene of scenes) {
+    for (const action of actions) {
+      variants.push(`${scene}${action}`);
+    }
+  }
+
+  if (uncertainS1 || uncertainS2) {
+    variants.push("我参与过一些整理和协助类的事情");
+  }
+
+  return [...new Set(variants)];
+}
